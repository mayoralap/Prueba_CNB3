<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Columba Notebook – Verificación de Identidad v6.6.7</title>

  <style>
    :root {
      --color-primary: #1a73e8;
      --color-error: #d32f2f;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .app-logo {
      width: 120px;
      margin-bottom: 20px;
    }

    #buttonDiv {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #mensaje {
      margin-top: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    #diagnosticoWeb {
      margin-top: 14px;
      padding: 10px;
      font-size: 12px;
      text-align: left;
      background: #f1f3f4;
      border-radius: 8px;
      color: #3c4043;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="main-card">

    <img src="img/ico_ColumbaNotebook-PRO.png" alt="Logo Columba Notebook Pro" class="app-logo">

    <h2>Verificación de Identidad v6.6.7</h2>

    <p>
      Para verificar el estado de tu cuenta inicia sesión con Google.
    </p>

    <div id="buttonDiv"></div>

    <div id="mensaje"></div>

    <div id="diagnosticoWeb"></div>

  </div>

  <script>
    const CLIENTE_WEB =
      "839165918275-9e3pbpo84he4ti6m038ldbg21cj37fdr.apps.googleusercontent.com";

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycby4ov5QtHYZUiw3CCXqpyxD8tU3LAiBSuZeKmTDcnY_FpTX_k946XlkJgEGoJTNsdOMLg/exec";

    function mostrarAviso(texto, error = false) {
      const m = document.getElementById("mensaje");
      if (!m) return;
      m.style.color = error ? "#d32f2f" : "#1a73e8";
      m.textContent = texto;
    }

    function generarHuellaDigitalWeb() {
      const raw = [
        navigator.userAgent,
        navigator.language,
        screen.width,
        screen.height,
        screen.colorDepth
      ].join("|");

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }

      return "FP-" + Math.abs(hash).toString(36).toUpperCase();
    }

    function obtenerOGenerarDeviceId() {
      let id = localStorage.getItem("cn_device_id");
      if (!id) {
        id =
          "DEV-" +
          Math.random()
            .toString(36)
            .substring(2, 10)
            .toUpperCase();
        localStorage.setItem("cn_device_id", id);
      }
      return id;
    }

    function actualizarDiagnosticoWeb() {
      const box = document.getElementById("diagnosticoWeb");
      if (!box) return;

      const info = {
        entorno: "web-github",
        origen: window.location.origin,
        deviceId: obtenerOGenerarDeviceId(),
        huellaDigital: generarHuellaDigitalWeb(),
        gisCargado: Boolean(window.google && window.google.accounts && window.google.accounts.id)
      };

      box.textContent = JSON.stringify(info, null, 2);
    }

    function construirURLFinal(token) {
      const deviceId = obtenerOGenerarDeviceId();
      const huellaDigital = generarHuellaDigitalWeb();
      const devName = navigator.userAgent;

      return (
        URL_APPS_SCRIPT +
        "?token=" + encodeURIComponent(token) +
        "&deviceId=" + encodeURIComponent(deviceId) +
        "&devName=" + encodeURIComponent(devName) +
        "&huellaDigital=" + encodeURIComponent(huellaDigital)
      );
    }

    function capturarTokenDeUrl() {
      const params = new URLSearchParams(window.location.search);
      const queryToken =
        params.get("token") ||
        params.get("id_token") ||
        params.get("credential");

      if (queryToken) return queryToken;

      if (window.location.hash && window.location.hash.length > 1) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const hashToken =
          hashParams.get("token") ||
          hashParams.get("id_token") ||
          hashParams.get("credential");

        if (hashToken) return hashToken;
      }

      return null;
    }

    window.C = function (resp) {
      if (!resp || !resp.credential) {
        mostrarAviso("No se recibió credencial de Google Web.", true);
        return;
      }

      mostrarAviso("Acceso correcto, redirigiendo...");
      window.location.href = construirURLFinal(resp.credential);
    };

    function cargarScriptGISWeb() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        return Promise.resolve(true);
      }

      return new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.async = true;
        script.defer = true;
        script.onload = () =>
          resolve(Boolean(window.google && window.google.accounts && window.google.accounts.id));
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    }

    async function inicializar() {
      actualizarDiagnosticoWeb();

      const tokenRetorno = capturarTokenDeUrl();
      if (tokenRetorno) {
        mostrarAviso("Token recibido, redirigiendo...");
        window.location.href = construirURLFinal(tokenRetorno);
        return;
      }

      const gisListo = await cargarScriptGISWeb();
      actualizarDiagnosticoWeb();

      if (gisListo && window.google && window.google.accounts && window.google.accounts.id) {
        google.accounts.id.initialize({
          client_id: CLIENTE_WEB,
          callback: window.C
        });

        google.accounts.id.renderButton(
          document.getElementById("buttonDiv"),
          {
            theme: "outline",
            size: "large",
            width: 290
          }
        );
      } else {
        mostrarAviso("No se pudo cargar Google Identity Services en el navegador.", true);
      }
    }

    window.addEventListener("load", inicializar);
  </script>

</body>

</html>
