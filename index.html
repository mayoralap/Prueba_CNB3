<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Columba Notebook – Verificación de Identidad v6.6.9</title>

  <style>
    :root {
      --color-primary: #1a73e8;
      --color-error: #d32f2f;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .app-logo {
      width: 120px;
      margin-bottom: 20px;
    }

    #buttonDiv {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #mensaje {
      margin-top: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    #diagnosticoWeb {
      margin-top: 14px;
      padding: 10px;
      font-size: 12px;
      text-align: left;
      background: #f1f3f4;
      border-radius: 8px;
      color: #3c4043;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .btn-google-nativo {
      width: 290px;
      height: 42px;
      border: none;
      border-radius: 4px;
      background: var(--color-primary);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-google-nativo:hover {
      background: #1558b0;
    }

    .btn-google-nativo:disabled {
      background: #9aa0a6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="main-card">

    <img src="img/ico_ColumbaNotebook-PRO.png" alt="Logo Columba Notebook Pro" class="app-logo">

    <h2>Verificación de Identidad v6.6.9</h2>

    <p>
      Para verificar el estado de tu cuenta inicia sesión con Google.
    </p>

    <div id="buttonDiv"></div>

    <div id="mensaje"></div>

    <div id="diagnosticoWeb"></div>

  </div>

  <script>
    const CLIENTE_WEB =
      "839165918275-9e3pbpo84he4ti6m038ldbg21cj37fdr.apps.googleusercontent.com";

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycby4ov5QtHYZUiw3CCXqpyxD8tU3LAiBSuZeKmTDcnY_FpTX_k946XlkJgEGoJTNsdOMLg/exec";

    function mostrarAviso(texto, error = false) {
      const m = document.getElementById("mensaje");
      if (!m) return;
      m.style.color = error ? "#d32f2f" : "#1a73e8";
      m.textContent = texto;
    }

    function obtenerCapacitor() {
      return window.Capacitor || null;
    }

    function esEntornoNativo() {
      const cap = obtenerCapacitor();
      const capNativo = Boolean(
        cap && typeof cap.isNativePlatform === "function" && cap.isNativePlatform()
      );
      const uaNativo = navigator.userAgent.includes("ColumbaAppNative");
      const bridgeNativo = Boolean(window.androidBridge);
      return capNativo || uaNativo || bridgeNativo;
    }

    function obtenerPluginColumbaAuth() {
      const cap = obtenerCapacitor();
      if (cap && cap.Plugins && cap.Plugins.ColumbaAuth) {
        return cap.Plugins.ColumbaAuth;
      }
      return null;
    }

    async function esperarPluginColumbaAuth(intentosMax = 25, intervaloMs = 150) {
      for (let i = 0; i < intentosMax; i++) {
        const plugin = obtenerPluginColumbaAuth();
        if (plugin && typeof plugin.loginGoogle === "function") {
          return plugin;
        }
        await new Promise((resolve) => setTimeout(resolve, intervaloMs));
      }
      return null;
    }

    function generarHuellaDigitalWeb() {
      const raw = [
        navigator.userAgent,
        navigator.language,
        screen.width,
        screen.height,
        screen.colorDepth
      ].join("|");

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }

      return "FP-" + Math.abs(hash).toString(36).toUpperCase();
    }

    function obtenerOGenerarDeviceId() {
      let id = localStorage.getItem("cn_device_id");
      if (!id) {
        id =
          "DEV-" +
          Math.random()
            .toString(36)
            .substring(2, 10)
            .toUpperCase();
        localStorage.setItem("cn_device_id", id);
      }
      return id;
    }

    function construirURLFinal(token) {
      const deviceId = obtenerOGenerarDeviceId();
      const huellaDigital = generarHuellaDigitalWeb();
      const devName = navigator.userAgent;

      return (
        URL_APPS_SCRIPT +
        "?token=" + encodeURIComponent(token) +
        "&deviceId=" + encodeURIComponent(deviceId) +
        "&devName=" + encodeURIComponent(devName) +
        "&huellaDigital=" + encodeURIComponent(huellaDigital)
      );
    }

    function capturarTokenDeUrl() {
      const params = new URLSearchParams(window.location.search);
      const queryToken =
        params.get("token") ||
        params.get("id_token") ||
        params.get("credential");

      if (queryToken) return queryToken;

      if (window.location.hash && window.location.hash.length > 1) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const hashToken =
          hashParams.get("token") ||
          hashParams.get("id_token") ||
          hashParams.get("credential");

        if (hashToken) return hashToken;
      }

      return null;
    }

    function actualizarDiagnostico() {
      const box = document.getElementById("diagnosticoWeb");
      if (!box) return;

      const nativo = esEntornoNativo();
      const cap = obtenerCapacitor();
      const plugin = obtenerPluginColumbaAuth();

      const info = {
        entorno: nativo ? "nativo-android" : "web-github",
        origen: window.location.origin,
        uaNativo: navigator.userAgent.includes("ColumbaAppNative"),
        capacitorDetectado: Boolean(cap),
        columbaAuthDisponible: Boolean(plugin && typeof plugin.loginGoogle === "function"),
        deviceId: obtenerOGenerarDeviceId(),
        huellaDigital: generarHuellaDigitalWeb(),
        gisCargado: Boolean(window.google && window.google.accounts && window.google.accounts.id)
      };

      box.textContent = JSON.stringify(info, null, 2);
    }

    async function invocarLoginGoogleNativo(payload) {
      const plugin = await esperarPluginColumbaAuth();
      if (plugin && typeof plugin.loginGoogle === "function") {
        return await plugin.loginGoogle(payload);
      }

      const cap = obtenerCapacitor();
      if (cap && typeof cap.nativePromise === "function") {
        return await cap.nativePromise("ColumbaAuth", "loginGoogle", payload);
      }

      throw new Error("No se encontró el puente nativo ColumbaAuth.loginGoogle");
    }

    async function iniciarLoginNativoAndroid() {
      const btn = document.getElementById("btnGoogleNativo");
      if (btn) btn.disabled = true;

      try {
        mostrarAviso("Abriendo selector nativo de Google...");
        const respuesta = await invocarLoginGoogleNativo({
          webClientId: CLIENTE_WEB
        });

        const token = respuesta?.token || respuesta?.result?.token;
        if (!token) {
          mostrarAviso("Google no devolvió token de sesión.", true);
          if (btn) btn.disabled = false;
          return;
        }

        mostrarAviso("Token recibido, redirigiendo...");
        window.location.href = construirURLFinal(token);
      } catch (error) {
        mostrarAviso(error?.message || String(error), true);
        if (btn) btn.disabled = false;
      }
    }

    function renderizarBotonNativo() {
      const buttonDiv = document.getElementById("buttonDiv");
      if (!buttonDiv) return;

      buttonDiv.innerHTML = `
        <button id="btnGoogleNativo" type="button" class="btn-google-nativo">
          Iniciar sesión con Google (App)
        </button>
      `;

      const btn = document.getElementById("btnGoogleNativo");
      if (btn) {
        btn.addEventListener("click", iniciarLoginNativoAndroid);
      }
    }

    window.C = function (resp) {
      if (!resp || !resp.credential) {
        mostrarAviso("No se recibió credencial de Google Web.", true);
        return;
      }

      mostrarAviso("Acceso correcto, redirigiendo...");
      window.location.href = construirURLFinal(resp.credential);
    };

    function cargarScriptGISWeb() {
      if (window.google && window.google.accounts && window.google.accounts.id) {
        return Promise.resolve(true);
      }

      return new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.async = true;
        script.defer = true;
        script.onload = () =>
          resolve(Boolean(window.google && window.google.accounts && window.google.accounts.id));
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    }

    async function inicializar() {
      actualizarDiagnostico();

      const tokenRetorno = capturarTokenDeUrl();
      if (tokenRetorno) {
        mostrarAviso("Token recibido, redirigiendo...");
        window.location.href = construirURLFinal(tokenRetorno);
        return;
      }

      if (esEntornoNativo()) {
        renderizarBotonNativo();
        await esperarPluginColumbaAuth();
        actualizarDiagnostico();
        return;
      }

      const gisListo = await cargarScriptGISWeb();
      actualizarDiagnostico();

      if (gisListo && window.google && window.google.accounts && window.google.accounts.id) {
        google.accounts.id.initialize({
          client_id: CLIENTE_WEB,
          callback: window.C
        });

        google.accounts.id.renderButton(
          document.getElementById("buttonDiv"),
          {
            theme: "outline",
            size: "large",
            width: 290
          }
        );
      } else {
        mostrarAviso("No se pudo cargar Google Identity Services en el navegador.", true);
      }
    }

    window.addEventListener("load", inicializar);
  </script>

</body>

</html>
