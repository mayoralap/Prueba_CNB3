<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Columba Notebook – Verificación de Identidad v5</title>

  <style>
    :root {
      --color-primary: #1a73e8;
      --color-error: #d32f2f;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .logo-img {
      width: 120px;
      margin-bottom: 20px;
    }

    #buttonDiv {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #mensaje {
      margin-top: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    #diagnosticoBridge {
      margin-top: 14px;
      padding: 10px;
      font-size: 12px;
      text-align: left;
      background: #f1f3f4;
      border-radius: 8px;
      color: #3c4043;
      word-break: break-word;
    }

    .btn-google {
      width: 290px;
      height: 42px;
      border: none;
      border-radius: 4px;
      background: var(--color-primary);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-google:hover {
      background: #1558b0;
    }
  </style>
</head>

<body>

  <div class="main-card">

    <img src="https://drive.google.com/thumbnail?id=15hTMpm_5aNuU2QKTWZGdK2XKdtpEog4w" class="logo-img"
      alt="Columba Notebook">

    <h2>Verificación de Identidad v5</h2>

    <p>
      Para verificar el estado de tu cuenta inicia sesión con Google.
    </p>

    <div id="buttonDiv"></div>

    <div id="mensaje"></div>

    <div id="diagnosticoBridge"></div>

  </div>

  <script type="module">

    import { Capacitor }
      from 'https://cdn.jsdelivr.net/npm/@capacitor/core@8.6.0/+esm';

    const CLIENTE_WEB =
      "498552950849-4cj5lp97qrbqf63jc914ji96lq744m4t.apps.googleusercontent.com";
    
    const CLIENTE_ANDROID =
      "839165918275-7k8cp04fnbo9id02i2s6ni5pqvvl5om3.apps.googleusercontent.com";

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycby4ov5QtHYZUiw3CCXqpyxD8tU3LAiBSuZeKmTDcnY_FpTX_k946XlkJgEGoJTNsdOMLg/exec";

    // URL de retorno / auth bridge en tu dominio o Apps Script (ajústala si usas un endpoint propio de retorno)
    const REDIRECT_URI_WEB = window.location.origin + window.location.pathname;

    function mostrarAviso(texto, error = false) {
      const m = document.getElementById("mensaje");
      if (!m) return;
      m.style.color = error ? "#d32f2f" : "#1a73e8";
      m.textContent = texto;
    }

    function actualizarDiagnosticoBridge() {
      const box = document.getElementById("diagnosticoBridge");
      if (!box) return;

      const cap = window.Capacitor || Capacitor;
      const info = {
        platform: cap?.getPlatform ? cap.getPlatform() : "web",
        isNative: cap?.isNativePlatform ? cap.isNativePlatform() : false,
        plugins: Object.keys(cap?.Plugins || {})
      };

      box.textContent = "Bridge: " + JSON.stringify(info);
    }

    function generarHuellaDigitalNativa() {
      const raw = [
        navigator.userAgent,
        navigator.language,
        screen.width,
        screen.height,
        screen.colorDepth
      ].join("|");

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }

      return "FP-" + Math.abs(hash).toString(36).toUpperCase();
    }

    function obtenerOGenerarDeviceId() {
      let id = localStorage.getItem("cn_device_id");
      if (!id) {
        id =
          "DEV-" +
          Math.random()
            .toString(36)
            .substring(2, 10)
            .toUpperCase();
        localStorage.setItem("cn_device_id", id);
      }
      return id;
    }

    function construirURLFinal(token) {
      const deviceId = obtenerOGenerarDeviceId();
      const huellaDigital = generarHuellaDigitalNativa();
      const devName = navigator.userAgent;

      return (
        URL_APPS_SCRIPT +
        "?token=" + encodeURIComponent(token) +
        "&deviceId=" + encodeURIComponent(deviceId) +
        "&devName=" + encodeURIComponent(devName) +
        "&huellaDigital=" + encodeURIComponent(huellaDigital)
      );
    }

    function capturarTokenDeUrl() {
      // Revisa query string (?token=... o ?id_token=... o ?access_token=...)
      const params = new URLSearchParams(window.location.search);
      const queryToken =
        params.get("token") ||
        params.get("id_token") ||
        params.get("access_token") ||
        params.get("credential");

      if (queryToken) return queryToken;

      // Revisa hash (#id_token=... o #access_token=...)
      if (window.location.hash && window.location.hash.length > 1) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const hashToken =
          hashParams.get("token") ||
          hashParams.get("id_token") ||
          hashParams.get("access_token") ||
          hashParams.get("credential");

        if (hashToken) return hashToken;
      }

      return null;
    }

    function iniciarFlujoGoogleSinPlugin() {
      actualizarDiagnosticoBridge();
      mostrarAviso("Abriendo autenticación de Google...");

      const state = btoa(JSON.stringify({
        deviceId: obtenerOGenerarDeviceId(),
        huellaDigital: generarHuellaDigitalNativa(),
        ts: Date.now()
      }));

      const authUrl = new URL("https://accounts.google.com/o/oauth2/v2/auth");
      authUrl.searchParams.set("client_id", CLIENTE_WEB);
      authUrl.searchParams.set("redirect_uri", REDIRECT_URI_WEB);
      authUrl.searchParams.set("response_type", "token");
      authUrl.searchParams.set("scope", "openid email profile");
      authUrl.searchParams.set("state", state);
      authUrl.searchParams.set("prompt", "select_account");

      window.location.href = authUrl.toString();
    }

    globalThis.ejecutarLoginMovilNativo = async function () {
      try {
        iniciarFlujoGoogleSinPlugin();
      } catch (error) {
        mostrarAviso(
          "Error al iniciar sesión con Google: " + (error?.message || String(error)),
          true
        );
      }
    };

    window.C = function (resp) {
      if (!resp?.credential) {
        mostrarAviso("No se recibió credencial", true);
        return;
      }

      mostrarAviso("Acceso correcto...");
      window.location.href = construirURLFinal(resp.credential);
    };

    async function cargarScriptGISWeb() {
      if (window.google?.accounts?.id) return true;

      return new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.async = true;
        script.defer = true;
        script.onload = () => resolve(Boolean(window.google?.accounts?.id));
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    }

    function renderizarBotonDirecto() {
      const buttonDiv = document.getElementById("buttonDiv");
      buttonDiv.innerHTML = `
        <button id="btnGoogleLogin" type="button" class="btn-google">
          Iniciar sesión con Google
        </button>
      `;

      const btn = document.getElementById("btnGoogleLogin");
      if (btn) {
        btn.addEventListener("click", iniciarFlujoGoogleSinPlugin);
      }
    }

    async function inicializar() {
      actualizarDiagnosticoBridge();

      // Si regresamos con un token en URL o hash, redirigir de inmediato a Apps Script
      const tokenRetorno = capturarTokenDeUrl();
      if (tokenRetorno) {
        mostrarAviso("Token recibido, redirigiendo...");
        window.location.href = construirURLFinal(tokenRetorno);
        return;
      }

      const esNativo =
        Boolean(window.Capacitor?.isNativePlatform?.()) ||
        Boolean(Capacitor?.isNativePlatform?.());

      // En Android o cuando GIS no aplique en WebView remoto, usamos el botón directo sin plugin
      if (esNativo) {
        renderizarBotonDirecto();
        return;
      }

      const gisListo = await cargarScriptGISWeb();
      if (gisListo && window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: CLIENTE_ANDROID,
          callback: C
        });

        google.accounts.id.renderButton(
          document.getElementById("buttonDiv"),
          {
            theme: "outline",
            size: "large",
            width: 290
          }
        );
      } else {
        renderizarBotonDirecto();
      }
    }

    window.addEventListener("load", inicializar);

  </script>

</body>

</html>
